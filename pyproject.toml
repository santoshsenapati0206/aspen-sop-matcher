[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-matcher"
version = "0.1.0"
description = "Level 0 of ASPEN MLOps ticket automation: match a ticket to the right SOP"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
databricks = ["databricks-ai-search"]
dense = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "reportlab>=4.0"]

[project.scripts]
sop-matcher = "sop_matcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
